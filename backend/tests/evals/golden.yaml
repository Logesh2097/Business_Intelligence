    as: analyst@brewbite.example
    question: "For each outlet, what was the revenue per visiting customer last month?"
    scope: {company: "Brew & Bite Cafés", outlets: all}
    period: {name: "last month", from: "2026-10-01", to: "2026-10-31"}
    metric: "revenue = SUM(orders.total_amount - orders.tax_amount) on completed orders (after discounts, before tax); visiting customers = COUNT(DISTINCT customer_visits.customer_id); revenue per customer = revenue / visiting customers"
    route:
      expect: general
