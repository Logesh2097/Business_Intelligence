  - id: F3-sales-and-purchases-by-month
    group: F
    status: verified
    tags: [general, cross_domain, by_month, aggregation]
    as: analyst@brewbite.example
    question: "For each month from July 2026 to October 2026, show revenue and purchases side by side."
    scope: {company: "Brew & Bite Cafés", outlets: all}
    period: {name: "four named months", from: "2026-07-01", to: "2026-10-31"}
    metric: "revenue = SUM(orders.total_amount - orders.tax_amount) on completed orders (after discounts, before tax); purchases = SUM(purchase_orders.total_amount) where status = 'received'"
    route:
      expect: general
    compare: rows
    interpretation: "Four rows in calendar order. July is a part month: the data starts on 14 July 2026. Each figure is worked out on its own and then put beside the other."
    parts:
      - agent: general
        verify_sql: |
          SELECT x.month,
            (SELECT ROUND(SUM(o.total_amount - o.tax_amount), 2) FROM biz.orders o
              WHERE o.tenant_id = :tenant AND o.status = 'completed'
                AND to_char(o.order_date, 'YYYY-MM') = x.month) AS revenue,
            (SELECT ROUND(SUM(po.total_amount), 2) FROM biz.purchase_orders po
              WHERE po.tenant_id = :tenant AND po.status = 'received'
                AND to_char(po.ordered_on, 'YYYY-MM') = x.month) AS purchases
          FROM (VALUES ('2026-07'), ('2026-08'), ('2026-09'), ('2026-10')) AS x(month)
          ORDER BY x.month
        pipeline_sql: |
          WITH revenue AS (
            SELECT CAST(DATE_TRUNC('month', o.order_date) AS DATE) AS month, SUM(o.total_amount - o.tax_amount) AS revenue
            FROM orders o WHERE o.status = 'completed'
              AND o.order_date BETWEEN DATE '2026-07-01' AND DATE '2026-10-31' GROUP BY 1),
          purchases AS (
            SELECT CAST(DATE_TRUNC('month', po.ordered_on) AS DATE) AS month, SUM(po.total_amount) AS purchases
            FROM purchase_orders po WHERE po.status = 'received'
              AND po.ordered_on BETWEEN DATE '2026-07-01' AND DATE '2026-10-31' GROUP BY 1)
          SELECT r.month, ROUND(r.revenue, 2) AS revenue, ROUND(p.purchases, 2) AS purchases
          FROM revenue r LEFT JOIN purchases p ON p.month = r.month ORDER BY r.month
        expected:
          order: enforced
          columns:
            - {name: month, type: month}
            - {name: revenue, type: money}
            - {name: purchases, type: money}
          rows:
            - {month: "2026-07", revenue: 531441.50, purchases: 75920.00}
            - {month: "2026-08", revenue: 946609.50, purchases: 54040.00}
            - {month: "2026-09", revenue: 882953.50, purchases: 63420.00}
            - {month: "2026-10", revenue: 902538.00, purchases: 71320.00}
    traps:
      - name: "orders joined to purchase orders on the outlet"
        why: "every order is repeated once per purchase order of its outlet"
        sql: |
          SELECT ROUND(SUM(o.total_amount - o.tax_amount), 2) AS v FROM orders o JOIN purchase_orders po ON po.outlet_id = o.outlet_id
          WHERE o.status = 'completed' AND o.order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31'
        gives: 3610152.00
        correct: 902538.00
        aggregation_check: refused
        correctness_check: passed

  - id: F4-revenue-per-visiting-customer
