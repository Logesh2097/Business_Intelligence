            SELECT o.outlet_id, SUM(o.total_amount - o.tax_amount) AS revenue FROM orders o
            WHERE o.status = 'completed' AND o.order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31' GROUP BY o.outlet_id),
          spent AS (
            SELECT e.outlet_id, SUM(e.amount) AS expenses FROM expenses e
            WHERE e.expense_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31' GROUP BY e.outlet_id)
          SELECT t.name AS outlet, ROUND(r.revenue, 2) AS revenue, ROUND(s.expenses, 2) AS expenses,
