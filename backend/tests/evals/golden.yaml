            - {product: "Bottled Water", revenue: 13880.00}
            - {product: "Butter Croissant", revenue: 47250.00}
            - {product: "Cappuccino", revenue: 93420.00}
            - {product: "Cheesecake Slice", revenue: 48880.00}
            - {product: "Chicken Club Sandwich", revenue: 70080.00}
            - {product: "Chocolate Brownie", revenue: 52820.00}
            - {product: "Cinnamon Roll", revenue: 10030.00}
            - {product: "Cold Brew", revenue: 68040.00}
            - {product: "Espresso", revenue: 30240.00}
            - {product: "Filter Coffee", revenue: 40590.00}
            - {product: "Fresh Lime Soda", revenue: 24200.00}
            - {product: "Green Tea", revenue: 14410.00}
            - {product: "Iced Lemon Tea", revenue: 25060.00}
            - {product: "Latte", revenue: 91390.00}
            - {product: "Mango Smoothie", revenue: 50600.00}
            - {product: "Masala Chai", revenue: 31360.00}
            - {product: "Paneer Tikka Sandwich", revenue: 68120.00}
            - {product: "Tiramisu", revenue: 20160.00}
            - {product: "Veg Grilled Sandwich", revenue: 61600.00}

  - id: A4-top-selling-products
    group: A
    status: verified
    tags: [single_agent, ranking]
    as: analyst@brewbite.example
    question: "What were the top 5 selling products last month?"
    scope: {company: "Brew & Bite Cafés", outlets: all}
    period: {name: "last month", from: "2026-10-01", to: "2026-10-31"}
    metric: "units sold = SUM(order_items.quantity) on completed orders; top selling is ranked by units"
    route:
      expect: agents
      agents: [sales_agent]
    compare: rows
    interpretation: "Exactly five products, ranked by units sold on completed orders, highest first."
    parts:
      - agent: sales_agent
        verify_sql: |
          SELECT p.name AS product, ROUND(SUM(i.quantity), 2) AS units
          FROM biz.order_items i
          JOIN biz.products p ON p.id = i.product_id AND p.tenant_id = :tenant
          WHERE i.tenant_id = :tenant AND i.order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31' AND EXISTS (SELECT 1 FROM biz.orders o WHERE o.tenant_id = :tenant AND o.id = i.order_id AND o.status = 'completed')
          GROUP BY p.name
          ORDER BY units DESC, p.name
          LIMIT 5
        pipeline_sql: |
          SELECT p.name AS product, SUM(oi.quantity) AS units
          FROM order_items oi JOIN orders o ON o.id = oi.order_id JOIN products p ON p.id = oi.product_id
          WHERE o.status = 'completed' AND oi.order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31'
          GROUP BY p.name ORDER BY units DESC, p.name LIMIT 5
        expected:
          order: enforced
          rank_by: units
          columns:
            - {name: product, type: text}
            - {name: units, type: number}
          rows:
            - {product: "Cappuccino", units: 519.00}
            - {product: "Latte", units: 481.00}
            - {product: "Filter Coffee", units: 451.00}
            - {product: "Masala Chai", units: 392.00}
            - {product: "Bottled Water", units: 347.00}

  - id: A5-revenue-of-low-stock-products
    group: A
    status: verified
    tags: [general, cross_domain, aggregation]
    as: analyst@brewbite.example
    question: "How much revenue comes from the products that are currently low on stock, at the outlets where they are low?"
    scope: {company: "Brew & Bite Cafés", outlets: all}
    period: {name: "all data", from: "2026-07-14", to: "2026-11-10"}
    metric: "product revenue = SUM(order_items.line_total) on completed orders (before order discounts); low stock = inventory_levels.quantity_on_hand <= reorder_level"
    route:
      expect: general
    compare: rows
    interpretation: "All-time product revenue of the three products that are low at Indiranagar, sold at Indiranagar. Needs sales joined to stock on the whole stock key."
    answer_must_contain: [207240.00]
    parts:
      - agent: general
        verify_sql: |
          SELECT ROUND(SUM(i.line_total), 2) AS revenue
          FROM biz.order_items i
          WHERE i.tenant_id = :tenant AND EXISTS (SELECT 1 FROM biz.orders o WHERE o.tenant_id = :tenant AND o.id = i.order_id AND o.status = 'completed')
            AND EXISTS (SELECT 1 FROM biz.inventory_levels l WHERE l.tenant_id = :tenant
                AND l.outlet_id = i.outlet_id AND l.product_id = i.product_id
                AND l.quantity_on_hand <= l.reorder_level)
        pipeline_sql: |
          SELECT ROUND(SUM(oi.line_total), 2) AS revenue
          FROM order_items oi JOIN orders o ON o.id = oi.order_id
          JOIN inventory_levels il ON il.outlet_id = oi.outlet_id AND il.product_id = oi.product_id
          WHERE o.status = 'completed' AND il.quantity_on_hand <= il.reorder_level
        expected:
          order: any
          columns:
            - {name: revenue, type: money}
          rows:
            - {revenue: 207240.00}
    traps:
      - name: "order totals across order lines"
        why: "each order's total is added once per order line (the wrong answer of Phase 5)"
        sql: |
          SELECT ROUND(SUM(o.total_amount - o.tax_amount), 2) AS v FROM orders o JOIN order_items oi ON o.id = oi.order_id
          JOIN inventory_levels il ON oi.outlet_id = il.outlet_id AND oi.product_id = il.product_id
          WHERE o.status = 'completed' AND il.quantity_on_hand <= il.reorder_level
        gives: 483402.00
        correct: 207240.00
        aggregation_check: refused
        correctness_check: passed
      - name: "stock joined on the product only"
        why: "counts sales at every outlet of a product that is low at one outlet"
        sql: |
          SELECT ROUND(SUM(oi.line_total), 2) AS v FROM order_items oi JOIN orders o ON o.id = oi.order_id
          JOIN inventory_levels il ON il.product_id = oi.product_id
          WHERE o.status = 'completed' AND il.quantity_on_hand <= il.reorder_level
        gives: 689200.00
        correct: 207240.00
        aggregation_check: refused
        correctness_check: passed

  - id: A6-revenue-two-outlets
    group: A
    status: verified
    tags: [single_agent, comparison]
    as: analyst@brewbite.example
    question: "Compare the revenue of Indiranagar and Koramangala last month."
    scope: {company: "Brew & Bite Cafés", outlets: all}
    period: {name: "last month", from: "2026-10-01", to: "2026-10-31"}
    metric: "revenue = SUM(orders.total_amount - orders.tax_amount) on completed orders (after discounts, before tax)"
    route:
      expect: agents
      agents: [sales_agent]
    compare: rows
    interpretation: "Two rows, one per named outlet, each with its October revenue."
    parts:
      - agent: sales_agent
        verify_sql: |
          SELECT t.name AS outlet,
            (SELECT ROUND(SUM(o.total_amount - o.tax_amount), 2) FROM biz.orders o
              WHERE o.tenant_id = :tenant AND o.outlet_id = t.id AND o.status = 'completed'
                AND o.order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31') AS revenue
          FROM biz.outlets t
          WHERE t.tenant_id = :tenant AND t.name IN ('Indiranagar', 'Koramangala')
          ORDER BY t.name
        pipeline_sql: |
          SELECT t.name AS outlet, ROUND(SUM(o.total_amount - o.tax_amount), 2) AS revenue
          FROM orders o JOIN outlets t ON t.id = o.outlet_id
          WHERE o.status = 'completed' AND o.order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31'
            AND (t.name ILIKE 'Indiranagar' OR t.name ILIKE 'Koramangala')
          GROUP BY t.name ORDER BY revenue DESC
        expected:
          order: any
          columns:
            - {name: outlet, type: text}
            - {name: revenue, type: money}
          rows:
            - {outlet: "Indiranagar", revenue: 270541.00}
            - {outlet: "Koramangala", revenue: 212858.50}

  - id: A7-completed-orders-all-time
    group: A
    status: verified
    tags: [single_agent]
    as: analyst@brewbite.example
    question: "How many completed orders do we have in total?"
    scope: {company: "Brew & Bite Cafés", outlets: all}
    period: {name: "all data", from: "2026-07-14", to: "2026-11-10"}
    metric: "orders = COUNT(*) of orders where status = 'completed'"
    route:
      expect: agents
      agents: [sales_agent]
    compare: rows
    interpretation: "Completed orders over all the data held (14 July to 10 November 2026). Cancelled and refunded orders are not counted."
    answer_must_contain: [6481]
    parts:
      - agent: sales_agent
        verify_sql: |
          SELECT COUNT(*) AS orders
          FROM biz.orders o
          WHERE o.tenant_id = :tenant AND o.status = 'completed'
        pipeline_sql: |
          SELECT COUNT(*) AS orders FROM orders o WHERE o.status = 'completed'
        expected:
          order: any
          columns:
            - {name: orders, type: count}
          rows:
            - {orders: 6481}

  - id: A8-average-order-value
    group: A
    status: verified
    tags: [single_agent, aggregation]
    as: analyst@brewbite.example
    question: "What was the average order value last month?"
    scope: {company: "Brew & Bite Cafés", outlets: all}
    period: {name: "last month", from: "2026-10-01", to: "2026-10-31"}
    metric: "average order value = revenue / COUNT(*) of completed orders"
    route:
      expect: agents
      agents: [sales_agent]
    compare: rows
    interpretation: "October revenue divided by the number of completed orders in October."
    answer_must_contain: [542.39]
    parts:
      - agent: sales_agent
        verify_sql: |
          SELECT ROUND(SUM(o.total_amount - o.tax_amount) / COUNT(*), 2) AS average_order_value
          FROM biz.orders o
          WHERE o.tenant_id = :tenant AND o.status = 'completed' AND o.order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31'
        pipeline_sql: |
          SELECT ROUND(SUM(o.total_amount - o.tax_amount) / NULLIF(COUNT(*), 0), 2) AS average_order_value
          FROM orders o WHERE o.status = 'completed' AND o.order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31'
        expected:
          order: any
          columns:
            - {name: average_order_value, type: money}
          rows:
            - {average_order_value: 542.39}
    traps:
      - name: "average across order lines"
        why: "orders with more lines weigh more, so the average is too high"
        sql: |
          SELECT ROUND(AVG(o.total_amount - o.tax_amount), 2) AS v FROM orders o JOIN order_items oi ON oi.order_id = o.id
          WHERE o.status = 'completed' AND o.order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31'
        gives: 673.46
        correct: 542.39
        aggregation_check: refused
        correctness_check: passed

  # ---- B. Inventory -------------------------------------------------------------

  - id: B1-low-stock-products
    group: B
    status: verified
    tags: [single_agent]
    as: analyst@brewbite.example
    question: "Which products are running low on stock?"
    scope: {company: "Brew & Bite Cafés", outlets: all}
    period: {name: "now (stock is a current level)"}
    metric: "low stock = inventory_levels.quantity_on_hand <= reorder_level"
    route:
      expect: agents
      agents: [inventory_agent]
    compare: rows
    interpretation: "Three products, all at Indiranagar, each with its stock on hand and reorder level."
    parts:
      - agent: inventory_agent
        verify_sql: |
          SELECT t.name AS outlet, p.name AS product,
            ROUND(l.quantity_on_hand, 2) AS on_hand, ROUND(l.reorder_level, 2) AS reorder_level
          FROM biz.inventory_levels l
          JOIN biz.outlets t ON t.id = l.outlet_id AND t.tenant_id = :tenant
          JOIN biz.products p ON p.id = l.product_id AND p.tenant_id = :tenant
          WHERE l.tenant_id = :tenant AND l.quantity_on_hand <= l.reorder_level
          ORDER BY t.name, p.name
        pipeline_sql: |
          SELECT t.name AS outlet, p.name AS product, il.quantity_on_hand AS on_hand, il.reorder_level
          FROM inventory_levels il JOIN outlets t ON t.id = il.outlet_id JOIN products p ON p.id = il.product_id
          WHERE il.quantity_on_hand <= il.reorder_level AND il.quantity_on_hand > 0 AND p.is_active
          ORDER BY t.name, p.name
        expected:
          order: any
          columns:
            - {name: outlet, type: text}
            - {name: product, type: text}
            - {name: on_hand, type: number}
            - {name: reorder_level, type: number}
          rows:
            - {outlet: "Indiranagar", product: "Cappuccino", on_hand: 10.00, reorder_level: 30.00}
            - {outlet: "Indiranagar", product: "Iced Lemon Tea", on_hand: 12.00, reorder_level: 18.00}
            - {outlet: "Indiranagar", product: "Veg Grilled Sandwich", on_hand: 8.00, reorder_level: 18.00}

  - id: B2-stock-by-outlet
    group: B
    status: verified
    tags: [single_agent, grouped]
    as: analyst@brewbite.example
    question: "How many units of stock does each outlet hold?"
    scope: {company: "Brew & Bite Cafés", outlets: all}
    period: {name: "now (stock is a current level)"}
    metric: "stock units = SUM(inventory_levels.quantity_on_hand)"
    route:
      expect: agents
      agents: [inventory_agent]
    compare: rows
    interpretation: "One row per outlet with the total units on hand now."
    parts:
      - agent: inventory_agent
        verify_sql: |
          SELECT t.name AS outlet,
            (SELECT ROUND(SUM(l.quantity_on_hand), 2) FROM biz.inventory_levels l
              WHERE l.tenant_id = :tenant AND l.outlet_id = t.id) AS units
          FROM biz.outlets t
          WHERE t.tenant_id = :tenant
          ORDER BY t.name
        pipeline_sql: |
          SELECT t.name AS outlet, SUM(il.quantity_on_hand) AS units
          FROM inventory_levels il JOIN outlets t ON t.id = il.outlet_id JOIN products p ON p.id = il.product_id
          WHERE p.is_active GROUP BY t.name ORDER BY t.name
        expected:
          order: any
          columns:
            - {name: outlet, type: text}
            - {name: units, type: number}
          rows:
            - {outlet: "Chennai Adyar", units: 1015.00}
            - {outlet: "Indiranagar", units: 1006.00}
            - {outlet: "Koramangala", units: 1089.00}
            - {outlet: "Mysuru Central", units: 1005.00}
            - {outlet: "Whitefield", units: 922.00}

  - id: B3-largest-shortage-outlet
    group: B
    status: verified
    tags: [single_agent, ranking]
    as: analyst@brewbite.example
    question: "Which outlet has the largest stock shortage?"
    scope: {company: "Brew & Bite Cafés", outlets: all}
    period: {name: "now (stock is a current level)"}
    metric: "shortage = SUM(reorder_level - quantity_on_hand) over rows where that is positive"
    route:
      expect: agents
      agents: [inventory_agent]
    compare: rows
    interpretation: "One outlet. Only Indiranagar has any shortage; an outlet with none must not be reported as the largest."
    answer_must_contain: [36.00]
    parts:
      - agent: inventory_agent
        verify_sql: |
          SELECT t.name AS outlet, ROUND(SUM(l.reorder_level - l.quantity_on_hand), 2) AS shortage
          FROM biz.inventory_levels l
          JOIN biz.outlets t ON t.id = l.outlet_id AND t.tenant_id = :tenant
          WHERE l.tenant_id = :tenant AND l.reorder_level > l.quantity_on_hand
          GROUP BY t.name
          ORDER BY shortage DESC, t.name
          LIMIT 1
        pipeline_sql: |
          SELECT t.name AS outlet, SUM(il.reorder_level - il.quantity_on_hand) AS shortage
          FROM inventory_levels il JOIN outlets t ON t.id = il.outlet_id JOIN products p ON p.id = il.product_id
          WHERE il.reorder_level - il.quantity_on_hand > 0 AND p.is_active
          GROUP BY t.name ORDER BY shortage DESC LIMIT 1
        expected:
          order: enforced
          columns:
            - {name: outlet, type: text}
            - {name: shortage, type: number}
          rows:
            - {outlet: "Indiranagar", shortage: 36.00}

  - id: B4-zero-stock-products
    group: B
    status: verified
    tags: [single_agent, empty_result]
    as: analyst@brewbite.example
    question: "Which products are out of stock?"
    scope: {company: "Brew & Bite Cafés", outlets: all}
    period: {name: "now (stock is a current level)"}
    metric: "out of stock = inventory_levels.quantity_on_hand <= 0"
    route:
      expect: agents
      agents: [inventory_agent]
    compare: empty
    interpretation: "No product is out of stock. The right answer is an empty result, said plainly; it must not list low-stock products instead."
    parts:
      - agent: inventory_agent
        verify_sql: |
          SELECT t.name AS outlet, p.name AS product
          FROM biz.inventory_levels l
          JOIN biz.outlets t ON t.id = l.outlet_id AND t.tenant_id = :tenant
          JOIN biz.products p ON p.id = l.product_id AND p.tenant_id = :tenant
          WHERE l.tenant_id = :tenant AND l.quantity_on_hand <= 0
        pipeline_sql: |
          SELECT t.name AS outlet, p.name AS product
          FROM inventory_levels il JOIN outlets t ON t.id = il.outlet_id JOIN products p ON p.id = il.product_id
          WHERE il.quantity_on_hand <= 0 AND p.is_active ORDER BY t.name, p.name
        expected:
          order: any
          columns:
            - {name: outlet, type: text}
            - {name: product, type: text}
          rows: []

  - id: B5-units-received-by-product
    group: B
    status: verified
    tags: [single_agent, grouped]
    as: analyst@brewbite.example
    question: "How many units of each product were received into stock in October 2026?"
