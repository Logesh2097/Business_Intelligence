  # ---- F. Cross-domain ----------------------------------------------------------

  - id: F1-revenue-and-shortage
    group: F
    status: verified
    tags: [multi_agent, cross_domain]
    as: analyst@brewbite.example
    question: "What was our total revenue last month, and what is our total stock shortage right now?"
    scope: {company: "Brew & Bite Cafés", outlets: all}
    period: {name: "last month for revenue; now for stock", from: "2026-10-01", to: "2026-10-31"}
    metric: "revenue = SUM(orders.total_amount - orders.tax_amount) on completed orders (after discounts, before tax); shortage = SUM(reorder_level - quantity_on_hand) over rows where that is positive"
    route:
      expect: agents
      agents: [sales_agent, inventory_agent]
    compare: rows
    interpretation: "Two independent facts from two areas: no join is needed, so two agents answer side by side."
    answer_must_contain: [902538.00, 36.00]
    parts:
      - agent: sales_agent
        verify_sql: |
          SELECT ROUND(SUM(o.total_amount - o.tax_amount), 2) AS revenue
          FROM biz.orders o
          WHERE o.tenant_id = :tenant AND o.status = 'completed'
            AND o.order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31'
        pipeline_sql: |
          SELECT ROUND(SUM(o.total_amount - o.tax_amount), 2) AS revenue FROM orders o
          WHERE o.status = 'completed' AND o.order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31'
        expected:
          order: any
          columns:
            - {name: revenue, type: money}
          rows:
            - {revenue: 902538.00}
      - agent: inventory_agent
        verify_sql: |
          SELECT ROUND(SUM(l.reorder_level - l.quantity_on_hand), 2) AS shortage
          FROM biz.inventory_levels l
          WHERE l.tenant_id = :tenant AND l.reorder_level > l.quantity_on_hand
        pipeline_sql: |
          SELECT SUM(il.reorder_level - il.quantity_on_hand) AS shortage
          FROM inventory_levels il JOIN products p ON p.id = il.product_id
          WHERE il.reorder_level - il.quantity_on_hand > 0 AND p.is_active
        expected:
          order: any
          columns:
            - {name: shortage, type: number}
          rows:
            - {shortage: 36.00}

