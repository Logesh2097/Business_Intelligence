    group: F
    status: verified
    tags: [multi_agent, cross_domain, grouped]
    as: analyst@brewbite.example
    question: "For each outlet, what was the revenue last month, and how many customer visits were there last month?"
    scope: {company: "Brew & Bite Cafés", outlets: all}
    period: {name: "last month", from: "2026-10-01", to: "2026-10-31"}
    metric: "revenue = SUM(orders.total_amount - orders.tax_amount) on completed orders (after discounts, before tax); visits = COUNT(*) of customer_visits"
    route:
      expect: agents
      agents: [sales_agent, customer_agent]
    compare: rows
    interpretation: "Two independent lists by outlet. Each agent answers its own; neither figure depends on the other."
    parts:
      - agent: sales_agent
        verify_sql: |
          SELECT t.name AS outlet,
