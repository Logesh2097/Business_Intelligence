            - {outlet: "Koramangala", revenue: 212858.50, customers: 194, revenue_per_customer: 1097.21}
            - {outlet: "Mysuru Central", revenue: 142643.00, customers: 141, revenue_per_customer: 1011.65}
            - {outlet: "Whitefield", revenue: 177526.00, customers: 159, revenue_per_customer: 1116.52}
    traps:
      - name: "orders joined to visits on the outlet"
        why: "every order is repeated once per visit to its outlet (the second wrong answer of Phase 5)"
        sql: |
          SELECT ROUND(SUM(o.total_amount - o.tax_amount), 2) AS v FROM outlets t JOIN orders o ON o.outlet_id = t.id
          JOIN customer_visits cv ON cv.outlet_id = t.id
          WHERE o.status = 'completed' AND o.order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31' AND cv.visit_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31'
