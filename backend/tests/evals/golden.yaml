    interpretation: "A percentage per outlet, to two places. Expenses exceed revenue at every outlet in the demo data, so each value is above 100."
    parts:
      - agent: general
        verify_sql: |
          SELECT x.outlet, ROUND(100 * x.expenses / x.revenue, 2) AS expense_percent
          FROM (
            SELECT t.name AS outlet,
              (SELECT SUM(o.total_amount - o.tax_amount) FROM biz.orders o
                WHERE o.tenant_id = :tenant AND o.outlet_id = t.id AND o.status = 'completed'
                  AND o.order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31') AS revenue,
              (SELECT SUM(e.amount) FROM biz.expenses e
                WHERE e.tenant_id = :tenant AND e.outlet_id = t.id AND e.expense_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31') AS expenses
            FROM biz.outlets t
            WHERE t.tenant_id = :tenant) x
          ORDER BY x.outlet
        pipeline_sql: |
          WITH revenue AS (
            SELECT o.outlet_id, SUM(o.total_amount - o.tax_amount) AS revenue FROM orders o
            WHERE o.status = 'completed' AND o.order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31' GROUP BY o.outlet_id),
          spent AS (
            SELECT e.outlet_id, SUM(e.amount) AS expenses FROM expenses e
            WHERE e.expense_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31' GROUP BY e.outlet_id)
          SELECT t.name AS outlet, ROUND(100 * s.expenses / NULLIF(r.revenue, 0), 2) AS expense_percent
          FROM outlets t JOIN revenue r ON r.outlet_id = t.id JOIN spent s ON s.outlet_id = t.id
          ORDER BY t.name
        expected:
          order: any
          columns:
            - {name: outlet, type: text}
            - {name: expense_percent, type: number}
          rows:
