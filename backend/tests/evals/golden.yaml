            - {outlet: "Koramangala", expense_percent: 168.15}
            - {outlet: "Mysuru Central", expense_percent: 214.58}
            - {outlet: "Whitefield", expense_percent: 179.44}
    traps:
      - name: "expenses joined to orders on outlet_id"
        why: "every expense is repeated once per order of its outlet"
        sql: |
          SELECT ROUND(SUM(e.amount), 2) AS v FROM expenses e JOIN orders o ON o.outlet_id = e.outlet_id
          WHERE e.expense_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31' AND o.order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31'
        gives: 615221585.48
