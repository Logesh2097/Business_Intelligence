  - id: G6-visits-and-orders-by-segment
    group: G
    status: verified
    tags: [single_agent, aggregation, duplicate_join]
    as: analyst@brewbite.example
    question: "For each customer segment, how many visits and how many completed orders were there last month?"
    scope: {company: "Brew & Bite Cafés", outlets: all}
    period: {name: "last month", from: "2026-10-01", to: "2026-10-31"}
    metric: "visits = COUNT(*) of customer_visits; orders = COUNT(*) of completed orders; both by the customer's segment"
    route:
      expect: agents
      agents: [customer_agent]
      accept:
        - {route: general, why: "orders are also sales data, so the general analyst is a defensible choice"}
    compare: rows
    interpretation: "Four segments. Orders with no known customer (walk-ins) belong to no segment and are left out."
    parts:
      - agent: customer_agent
        verify_sql: |
          SELECT s.segment,
            (SELECT COUNT(*) FROM biz.customer_visits v
              JOIN biz.customers cu ON cu.id = v.customer_id AND cu.tenant_id = :tenant
              WHERE v.tenant_id = :tenant AND cu.segment = s.segment AND v.visit_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31') AS visits,
            (SELECT COUNT(*) FROM biz.orders o
              JOIN biz.customers cu ON cu.id = o.customer_id AND cu.tenant_id = :tenant
              WHERE o.tenant_id = :tenant AND cu.segment = s.segment AND o.status = 'completed'
                AND o.order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31') AS orders
          FROM (SELECT DISTINCT c.segment FROM biz.customers c WHERE c.tenant_id = :tenant) s
          ORDER BY s.segment
        pipeline_sql: |
          WITH visits AS (
            SELECT c.segment, COUNT(*) AS visits FROM customer_visits v JOIN customers c ON c.id = v.customer_id
            WHERE v.visit_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31' GROUP BY c.segment),
          orders_made AS (
            SELECT c.segment, COUNT(*) AS orders FROM orders o JOIN customers c ON c.id = o.customer_id
            WHERE o.status = 'completed' AND o.order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31' GROUP BY c.segment)
          SELECT v.segment, v.visits, m.orders FROM visits v JOIN orders_made m ON m.segment = v.segment
          ORDER BY v.segment
        expected:
          order: any
          columns:
            - {name: segment, type: text}
            - {name: visits, type: count}
            - {name: orders, type: count}
          rows:
            - {segment: "corporate", visits: 105, orders: 82}
            - {segment: "new", visits: 364, orders: 292}
            - {segment: "regular", visits: 593, orders: 502}
            - {segment: "vip", visits: 185, orders: 151}
    traps:
      - name: "customers joined to both orders and visits"
        why: "every visit is repeated once per order of the same customer"
        sql: |
          SELECT COUNT(cv.id) AS v FROM customers c JOIN customer_visits cv ON cv.customer_id = c.id
          JOIN orders o ON o.customer_id = c.id
          WHERE cv.visit_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31' AND o.order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31' AND o.status = 'completed'
