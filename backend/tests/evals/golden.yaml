    question: "For each outlet, show revenue, expenses and revenue minus expenses for last month."
    scope: {company: "Brew & Bite Cafés", outlets: all}
    period: {name: "last month", from: "2026-10-01", to: "2026-10-31"}
    metric: "revenue = SUM(orders.total_amount - orders.tax_amount) on completed orders (after discounts, before tax); expenses = SUM(expenses.amount); net = revenue - expenses"
    route:
      expect: general
    compare: rows
    interpretation: "Revenue minus expenses per outlet. It is not gross profit: cost of goods is not subtracted."
    parts:
      - agent: general
        verify_sql: |
          SELECT x.outlet, x.revenue, x.expenses, ROUND(x.revenue - x.expenses, 2) AS net
          FROM (
            SELECT t.name AS outlet,
              (SELECT ROUND(SUM(o.total_amount - o.tax_amount), 2) FROM biz.orders o
                WHERE o.tenant_id = :tenant AND o.outlet_id = t.id AND o.status = 'completed'
                  AND o.order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31') AS revenue,
              (SELECT ROUND(SUM(e.amount), 2) FROM biz.expenses e
                WHERE e.tenant_id = :tenant AND e.outlet_id = t.id AND e.expense_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31') AS expenses
            FROM biz.outlets t
            WHERE t.tenant_id = :tenant) x
