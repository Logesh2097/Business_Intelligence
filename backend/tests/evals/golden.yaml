    parts:
      - agent: general
        verify_sql: |
          SELECT x.outlet, x.revenue, x.customers, ROUND(x.revenue / x.customers, 2) AS revenue_per_customer
          FROM (
            SELECT t.name AS outlet,
              (SELECT ROUND(SUM(o.total_amount - o.tax_amount), 2) FROM biz.orders o
                WHERE o.tenant_id = :tenant AND o.outlet_id = t.id AND o.status = 'completed'
                  AND o.order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31') AS revenue,
              (SELECT COUNT(DISTINCT v.customer_id) FROM biz.customer_visits v
                WHERE v.tenant_id = :tenant AND v.outlet_id = t.id AND v.visit_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31') AS customers
            FROM biz.outlets t
            WHERE t.tenant_id = :tenant) x
          ORDER BY x.outlet
        pipeline_sql: |
          WITH revenue AS (
            SELECT o.outlet_id, SUM(o.total_amount - o.tax_amount) AS revenue FROM orders o
            WHERE o.status = 'completed' AND o.order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31' GROUP BY o.outlet_id),
          visits AS (
            SELECT v.outlet_id, COUNT(DISTINCT v.customer_id) AS customers FROM customer_visits v
            WHERE v.visit_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31' GROUP BY v.outlet_id)
          SELECT t.name AS outlet, ROUND(r.revenue, 2) AS revenue, v.customers,
            ROUND(r.revenue / NULLIF(v.customers, 0), 2) AS revenue_per_customer
          FROM outlets t JOIN revenue r ON r.outlet_id = t.id JOIN visits v ON v.outlet_id = t.id
          ORDER BY t.name
        expected:
          order: any
          columns:
            - {name: outlet, type: text}
            - {name: revenue, type: money}
            - {name: customers, type: count}
            - {name: revenue_per_customer, type: money}
