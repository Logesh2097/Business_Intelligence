  - id: G1-revenue-by-category
    group: G
    status: verified
    tags: [single_agent, aggregation, duplicate_join]
    as: analyst@brewbite.example
    question: "What was the revenue of each product category last month?"
    scope: {company: "Brew & Bite Cafés", outlets: all}
    period: {name: "last month", from: "2026-10-01", to: "2026-10-31"}
    metric: "product revenue = SUM(order_items.line_total) on completed orders (before order discounts)"
    route:
      expect: agents
      agents: [sales_agent]
    compare: rows
    interpretation: "Six categories. Revenue split by category must add up order lines; an order's total cannot be split by category."
    parts:
      - agent: sales_agent
        verify_sql: |
          SELECT c.name AS category,
            (SELECT ROUND(SUM(i.line_total), 2) FROM biz.order_items i
              WHERE i.tenant_id = :tenant AND i.order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31' AND EXISTS (SELECT 1 FROM biz.orders o WHERE o.tenant_id = :tenant AND o.id = i.order_id AND o.status = 'completed')
                AND EXISTS (SELECT 1 FROM biz.products p WHERE p.tenant_id = :tenant
                            AND p.id = i.product_id AND p.category_id = c.id)) AS revenue
          FROM biz.categories c
          WHERE c.tenant_id = :tenant
          ORDER BY c.name
        pipeline_sql: |
          SELECT c.name AS category, ROUND(SUM(oi.line_total), 2) AS revenue
          FROM order_items oi JOIN orders o ON o.id = oi.order_id
          JOIN products p ON p.id = oi.product_id JOIN categories c ON c.id = p.category_id
          WHERE o.status = 'completed' AND oi.order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31'
          GROUP BY c.name ORDER BY revenue DESC
        expected:
          order: any
          columns:
            - {name: category, type: text}
            - {name: revenue, type: money}
          rows:
            - {category: "Bakery", revenue: 120850.00}
            - {category: "Beverages", revenue: 88680.00}
            - {category: "Coffee", revenue: 323680.00}
            - {category: "Desserts", revenue: 121860.00}
            - {category: "Sandwiches", revenue: 199800.00}
            - {category: "Tea", revenue: 70830.00}
    traps:
      - name: "orders joined to order_items, order totals added up"
        why: "the whole order's total is counted for every line, in every category on the bill"
        sql: |
          SELECT ROUND(SUM(o.total_amount - o.tax_amount), 2) AS v FROM orders o JOIN order_items oi ON oi.order_id = o.id
          JOIN products p ON p.id = oi.product_id JOIN categories c ON c.id = p.category_id
          WHERE o.status = 'completed' AND o.order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31' AND c.name = 'Coffee'
