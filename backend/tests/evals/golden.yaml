# The golden question set (docs/design/testing.md §5, README.md in this folder).
#
# Each case is a business question with an answer that was verified in PostgreSQL,
# independently of any model, on the evaluation database bi_eval (database.py:
# reference date 2026-11-11, seed 42, 120 days; "today" is 2026-11-11).
#
#   verify_sql    run as the database owner in a READ ONLY transaction. The owner is not
#                 limited by row security, so the company (:tenant) and, for a limited
#                 user, the outlets (:outlets) are written into the query; dataset.py
#                 refuses a query in which it cannot find them. This is the source of
#                 the expected rows.
#   pipeline_sql  a correct query as a model would write it. It is run through the
#                 guard and the aggregation check, as the case's user, under row
#                 security, and must return the same rows: two different queries, by
#                 two different routes, agreeing.
#   expected      every row the result must have. `make eval-check` fails if any stored
#                 value is not what verify_sql returns.
#   traps         queries a model might write that give a wrong figure, each with the
#                 figure it gives and what the aggregation check says about it.
#
# An expected value is never taken from a model's answer and never edited to make a
# run pass. To add or change a question, see README.md.

dataset:
  total: 58
  reference_date: 2026-11-11

cases:

  # ---- A. Sales -----------------------------------------------------------------

  - id: A1-revenue-last-month
    group: A
    status: verified
    tags: [single_agent, last_month]
    as: analyst@brewbite.example
    question: "What was our total revenue last month?"
    scope: {company: "Brew & Bite Cafés", outlets: all}
    period: {name: "last month", from: "2026-10-01", to: "2026-10-31"}
    metric: "revenue = SUM(orders.total_amount - orders.tax_amount) on completed orders (after discounts, before tax)"
    route:
      expect: agents
      agents: [sales_agent]
    compare: rows
    interpretation: "Revenue in October 2026 across all five outlets, after discounts and before tax."
    answer_must_contain: [902538.00]
    parts:
      - agent: sales_agent
        verify_sql: |
          SELECT ROUND(SUM(o.total_amount - o.tax_amount), 2) AS revenue
          FROM biz.orders o
          WHERE o.tenant_id = :tenant AND o.status = 'completed'
            AND o.order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31'
        pipeline_sql: |
          SELECT ROUND(SUM(o.total_amount - o.tax_amount), 2) AS revenue FROM orders o
          WHERE o.status = 'completed' AND o.order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31'
        expected:
          order: any
          columns:
            - {name: revenue, type: money}
          rows:
            - {revenue: 902538.00}
    traps:
      - name: "revenue with no status condition"
        why: "cancelled and refunded orders are counted as sales"
        sql: |
          SELECT ROUND(SUM(o.total_amount - o.tax_amount), 2) AS v FROM orders o
          WHERE o.order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31'
        gives: 962184.00
        correct: 902538.00
        aggregation_check: passed
        correctness_check: refused
        correctness_code: missing_status_filter

  - id: A2-revenue-by-outlet
    group: A
    status: verified
    tags: [single_agent, grouped]
    as: analyst@brewbite.example
    question: "What was the revenue of each outlet last month?"
    scope: {company: "Brew & Bite Cafés", outlets: all}
    period: {name: "last month", from: "2026-10-01", to: "2026-10-31"}
    metric: "revenue = SUM(orders.total_amount - orders.tax_amount) on completed orders (after discounts, before tax)"
    route:
      expect: agents
      agents: [sales_agent]
    compare: rows
    interpretation: "One row per outlet, five outlets; every outlet must carry its own October revenue."
    parts:
      - agent: sales_agent
        verify_sql: |
          SELECT t.name AS outlet,
            (SELECT ROUND(SUM(o.total_amount - o.tax_amount), 2) FROM biz.orders o
              WHERE o.tenant_id = :tenant AND o.outlet_id = t.id AND o.status = 'completed'
                AND o.order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31') AS revenue
          FROM biz.outlets t
          WHERE t.tenant_id = :tenant
          ORDER BY t.name
        pipeline_sql: |
          SELECT t.name AS outlet, ROUND(SUM(o.total_amount - o.tax_amount), 2) AS revenue
          FROM orders o JOIN outlets t ON t.id = o.outlet_id
          WHERE o.status = 'completed' AND o.order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31'
          GROUP BY t.name ORDER BY t.name
        expected:
          order: any
          columns:
            - {name: outlet, type: text}
            - {name: revenue, type: money}
          rows:
            - {outlet: "Chennai Adyar", revenue: 98969.50}
            - {outlet: "Indiranagar", revenue: 270541.00}
            - {outlet: "Koramangala", revenue: 212858.50}
            - {outlet: "Mysuru Central", revenue: 142643.00}
            - {outlet: "Whitefield", revenue: 177526.00}

  - id: A3-revenue-by-product
    group: A
    status: verified
    tags: [single_agent, grouped, metric_definition]
    as: analyst@brewbite.example
    question: "What was the revenue of each product last month?"
    scope: {company: "Brew & Bite Cafés", outlets: all}
    period: {name: "last month", from: "2026-10-01", to: "2026-10-31"}
    metric: "product revenue = SUM(order_items.line_total) on completed orders (before order discounts)"
    route:
      expect: agents
      agents: [sales_agent]
    compare: rows
    interpretation: "One row per product, all 21 products. Split by product, so it is product revenue (line totals), not order totals."
    parts:
      - agent: sales_agent
        verify_sql: |
          SELECT p.name AS product,
            (SELECT ROUND(SUM(i.line_total), 2) FROM biz.order_items i
              WHERE i.tenant_id = :tenant AND i.product_id = p.id AND i.order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31'
                AND EXISTS (SELECT 1 FROM biz.orders o WHERE o.tenant_id = :tenant AND o.id = i.order_id AND o.status = 'completed')) AS revenue
          FROM biz.products p
          WHERE p.tenant_id = :tenant
          ORDER BY p.name
        pipeline_sql: |
          SELECT p.name AS product, ROUND(SUM(oi.line_total), 2) AS revenue
          FROM order_items oi JOIN orders o ON o.id = oi.order_id JOIN products p ON p.id = oi.product_id
          WHERE o.status = 'completed' AND oi.order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31'
