  - id: G8-low-stock-with-units-sold
    group: G
    status: verified
    tags: [general, cross_domain, aggregation, safe_join_control]
    as: analyst@brewbite.example
    question: "For each product that is low on stock, show the outlet, the stock on hand and the units sold there last month."
    scope: {company: "Brew & Bite Cafés", outlets: all}
    period: {name: "last month", from: "2026-10-01", to: "2026-10-31"}
    metric: "units sold = SUM(order_items.quantity) on completed orders; low stock = inventory_levels.quantity_on_hand <= reorder_level"
    route:
      expect: general
    compare: rows
    interpretation: "The positive control: order lines joined to stock on BOTH outlet_id and product_id is a safe join and must not be refused."
    parts:
      - agent: general
        verify_sql: |
          SELECT t.name AS outlet, p.name AS product, ROUND(l.quantity_on_hand, 2) AS on_hand,
            (SELECT ROUND(COALESCE(SUM(i.quantity), 0), 2) FROM biz.order_items i
              WHERE i.tenant_id = :tenant AND i.outlet_id = l.outlet_id AND i.product_id = l.product_id
                AND i.order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31' AND EXISTS (SELECT 1 FROM biz.orders o WHERE o.tenant_id = :tenant AND o.id = i.order_id AND o.status = 'completed')) AS units_sold
          FROM biz.inventory_levels l
          JOIN biz.outlets t ON t.id = l.outlet_id AND t.tenant_id = :tenant
          JOIN biz.products p ON p.id = l.product_id AND p.tenant_id = :tenant
          WHERE l.tenant_id = :tenant AND l.quantity_on_hand <= l.reorder_level
          ORDER BY t.name, p.name
        pipeline_sql: |
          SELECT t.name AS outlet, p.name AS product, il.quantity_on_hand AS on_hand, SUM(oi.quantity) AS units_sold
          FROM order_items oi JOIN orders o ON o.id = oi.order_id
          JOIN inventory_levels il ON il.outlet_id = oi.outlet_id AND il.product_id = oi.product_id
          JOIN outlets t ON t.id = il.outlet_id JOIN products p ON p.id = il.product_id
          WHERE o.status = 'completed' AND oi.order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31' AND il.quantity_on_hand <= il.reorder_level
          GROUP BY t.name, p.name, il.quantity_on_hand ORDER BY t.name, p.name
        expected:
          order: any
          columns:
            - {name: outlet, type: text}
            - {name: product, type: text}
            - {name: on_hand, type: number}
            - {name: units_sold, type: number}
          rows:
            - {outlet: "Indiranagar", product: "Cappuccino", on_hand: 10.00, units_sold: 155.00}
            - {outlet: "Indiranagar", product: "Iced Lemon Tea", on_hand: 12.00, units_sold: 61.00}
            - {outlet: "Indiranagar", product: "Veg Grilled Sandwich", on_hand: 8.00, units_sold: 84.00}

