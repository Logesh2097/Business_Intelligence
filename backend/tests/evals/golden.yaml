          ORDER BY p.name
        pipeline_sql: |
          SELECT p.name AS product FROM products p
          WHERE NOT EXISTS (
            SELECT 1 FROM order_items oi JOIN orders o ON o.id = oi.order_id JOIN outlets t ON t.id = oi.outlet_id
            WHERE oi.product_id = p.id AND o.status = 'completed'
              AND oi.order_date = DATE '2026-10-05' AND t.name ILIKE 'Indiranagar')
          ORDER BY p.name
        expected:
          order: any
          columns:
            - {name: product, type: text}
          rows:
            - {product: "Banana Bread"}
            - {product: "Tiramisu"}
    traps:
      - name: "LEFT JOIN undone by a filter in WHERE"
        why: "the date filter in WHERE removes the unmatched rows the LEFT JOIN kept, so nothing is found"
        sql: |
          SELECT COUNT(*) AS v FROM products p LEFT JOIN order_items oi ON oi.product_id = p.id
          WHERE oi.order_date = DATE '2026-10-05' AND oi.id IS NULL
        gives: 0.00
        correct: 2.00
        aggregation_check: passed
        correctness_check: refused
        correctness_code: left_join_undone

  # ---- I. Metric definition -----------------------------------------------------

  - id: I1-gross-product-sales
    group: I
    status: verified
    tags: [single_agent, metric_definition]
    as: analyst@brewbite.example
    question: "What was the total sales value of the products sold last month, before order discounts?"
    scope: {company: "Brew & Bite Cafés", outlets: all}
    period: {name: "last month", from: "2026-10-01", to: "2026-10-31"}
    metric: "product revenue = SUM(order_items.line_total) on completed orders (before order discounts)"
    route:
      expect: agents
      agents: [sales_agent]
    compare: rows
    interpretation: "Product revenue: the sum of order lines. It is larger than total revenue by exactly the order discounts, and the two must not be swapped."
    answer_must_contain: [925700.00]
    parts:
      - agent: sales_agent
        verify_sql: |
          SELECT ROUND(SUM(i.line_total), 2) AS product_sales
          FROM biz.order_items i
          WHERE i.tenant_id = :tenant AND i.order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31' AND EXISTS (SELECT 1 FROM biz.orders o WHERE o.tenant_id = :tenant AND o.id = i.order_id AND o.status = 'completed')
        pipeline_sql: |
          SELECT ROUND(SUM(oi.line_total), 2) AS product_sales
          FROM order_items oi JOIN orders o ON o.id = oi.order_id
          WHERE o.status = 'completed' AND oi.order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31'
        expected:
          order: any
          columns:
            - {name: product_sales, type: money}
          rows:
            - {product_sales: 925700.00}
    traps:
      - name: "LEFT JOIN orders with the status condition in ON"
        why: "a LEFT JOIN keeps every order line, so the lines of cancelled and refunded orders are still added up"
        sql: |
          SELECT ROUND(SUM(oi.line_total), 2) AS v FROM order_items oi
          LEFT JOIN orders o ON o.id = oi.order_id AND o.status = 'completed'
          WHERE oi.order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31'
        gives: 986830.00
        correct: 925700.00
        aggregation_check: passed
        correctness_check: refused
        correctness_code: missing_status_filter

  - id: I2-gross-discounts-net
    group: I
    status: verified
    tags: [single_agent, metric_definition]
    as: analyst@brewbite.example
    question: "Last month, what were gross product sales, total order discounts, and net revenue?"
    scope: {company: "Brew & Bite Cafés", outlets: all}
    period: {name: "last month", from: "2026-10-01", to: "2026-10-31"}
    metric: "gross sales = SUM(order_items.line_total) = SUM(orders.subtotal); discounts = SUM(orders.discount_amount); net revenue = SUM(orders.total_amount - orders.tax_amount); completed orders"
    route:
      expect: agents
      agents: [sales_agent]
    compare: rows
    interpretation: "The three figures reconcile: gross product sales minus order discounts equals net revenue. Total revenue is the net figure."
    answer_must_contain: [925700.00, 23162.00, 902538.00]
    parts:
      - agent: sales_agent
        verify_sql: |
          SELECT
            (SELECT ROUND(SUM(i.line_total), 2) FROM biz.order_items i
              WHERE i.tenant_id = :tenant AND i.order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31' AND EXISTS (SELECT 1 FROM biz.orders o WHERE o.tenant_id = :tenant AND o.id = i.order_id AND o.status = 'completed')) AS gross_sales,
            (SELECT ROUND(SUM(o.discount_amount), 2) FROM biz.orders o
              WHERE o.tenant_id = :tenant AND o.status = 'completed' AND o.order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31') AS discounts,
            (SELECT ROUND(SUM(o.total_amount - o.tax_amount), 2) FROM biz.orders o
              WHERE o.tenant_id = :tenant AND o.status = 'completed' AND o.order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31') AS net_revenue
        pipeline_sql: |
          SELECT ROUND(SUM(o.subtotal), 2) AS gross_sales, ROUND(SUM(o.discount_amount), 2) AS discounts,
            ROUND(SUM(o.total_amount - o.tax_amount), 2) AS net_revenue
          FROM orders o WHERE o.status = 'completed' AND o.order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31'
        expected:
          order: any
          columns:
            - {name: gross_sales, type: money}
            - {name: discounts, type: money}
            - {name: net_revenue, type: money}
          rows:
            - {gross_sales: 925700.00, discounts: 23162.00, net_revenue: 902538.00}

  # ---- J. SUM(DISTINCT) ---------------------------------------------------------

  - id: J1-revenue-one-day-one-outlet
    group: J
    status: verified
    tags: [single_agent, sum_distinct, aggregation]
    as: analyst@brewbite.example
    question: "What was the revenue at Whitefield on 15 October 2026?"
    scope: {company: "Brew & Bite Cafés", outlets: all}
    period: {name: "one day", from: "2026-10-15", to: "2026-10-15"}
    metric: "revenue = SUM(orders.total_amount - orders.tax_amount) on completed orders (after discounts, before tax)"
    route:
      expect: agents
      agents: [sales_agent]
    compare: rows
    interpretation: "Eight completed orders that day, two of them for the same amount (1,340.00). Both are real sales and both count."
    answer_must_contain: [5984.00]
    parts:
      - agent: sales_agent
        verify_sql: |
          SELECT ROUND(SUM(o.total_amount - o.tax_amount), 2) AS revenue
          FROM biz.orders o
          JOIN biz.outlets t ON t.id = o.outlet_id AND t.tenant_id = :tenant
          WHERE o.tenant_id = :tenant AND o.status = 'completed'
            AND o.order_date = DATE '2026-10-15' AND t.name = 'Whitefield'
        pipeline_sql: |
          SELECT ROUND(SUM(o.total_amount - o.tax_amount), 2) AS revenue FROM orders o JOIN outlets t ON t.id = o.outlet_id
          WHERE o.status = 'completed' AND o.order_date = DATE '2026-10-15' AND t.name ILIKE 'Whitefield'
        expected:
          order: any
          columns:
            - {name: revenue, type: money}
          rows:
            - {revenue: 5984.00}
    traps:
      - name: "SUM(DISTINCT) on one table"
        why: "two different orders with the same amount are counted once, so a real sale is lost"
        sql: |
          SELECT ROUND(SUM(DISTINCT o.total_amount - o.tax_amount), 2) AS v FROM orders o JOIN outlets t ON t.id = o.outlet_id
          WHERE o.status = 'completed' AND o.order_date = DATE '2026-10-15' AND t.name ILIKE 'Whitefield'
        gives: 4644.00
        correct: 5984.00
        aggregation_check: passed
        correctness_check: refused
        correctness_code: sum_distinct
      - name: "SUM(DISTINCT) as a fix for a fan-out"
        why: "it removes the repeats of the join and also the genuine equal amounts, so it is still wrong"
        sql: |
          SELECT ROUND(SUM(DISTINCT o.total_amount - o.tax_amount), 2) AS v FROM orders o JOIN order_items oi ON oi.order_id = o.id
          JOIN outlets t ON t.id = o.outlet_id
          WHERE o.status = 'completed' AND o.order_date = DATE '2026-10-15' AND t.name ILIKE 'Whitefield'
        gives: 4644.00
        correct: 5984.00
        aggregation_check: passed
        correctness_check: refused
        correctness_code: sum_distinct

